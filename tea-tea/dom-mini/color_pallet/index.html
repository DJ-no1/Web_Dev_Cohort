<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Color Palette</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="container">
        <h1 id="title">Color Palette Generator</h1>

        <!-- Add the format selector -->
        <label for="format">Color Format:</label>
        <select id="format">
            <option value="hex">Hex</option>
            <option value="rgb">RGB</option>
        </select>

        <!-- Fix the button ID to match JS -->
        <button id="generateBtn">Generate Palette</button>

        <div id="palette"></div>
    </div>
</body>
</html>
