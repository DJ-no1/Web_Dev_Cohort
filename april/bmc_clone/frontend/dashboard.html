<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Stellar Seat Booking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap");

    body {
      font-family: "Outfit", sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
  </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
  <!-- Navigation Bar -->
  <nav class="bg-slate-800/60 backdrop-blur-xl border-b border-slate-700/50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">
        Stellar
      </h1>
      <div class="flex gap-4 items-center">
        <button onclick="navigateTo('bookings')" class="text-slate-400 hover:text-white transition">My Bookings</button>
        <button onclick="navigateTo('profile')" class="text-slate-400 hover:text-white transition">Profile</button>
        <button onclick="logout()" class="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-lg transition">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="max-w-7xl mx-auto px-6 py-10">
    <div class="text-center mb-12">
      <h2 class="text-4xl font-bold mb-2">Welcome to Stellar Cinema</h2>
      <p class="text-slate-400">Book your favorite seats now!</p>
    </div>

    <!-- Available Shows -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
      <div onclick="bookSeats(1)"
        class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-6 cursor-pointer hover:border-emerald-400/50 transition">
        <h3 class="text-xl font-bold mb-2">🎬 Dhurandhar The Revenge</h3>
        <p class="text-slate-400 text-sm mb-3">Today, 7:00 PM - Screen 1</p>
        <button class="w-full bg-emerald-500 hover:bg-emerald-600 py-2 rounded-lg transition">Book Now</button>
      </div>

      <div onclick="bookSeats(2)"
        class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-6 cursor-pointer hover:border-emerald-400/50 transition">
        <h3 class="text-xl font-bold mb-2">🎭 Action Adventure</h3>
        <p class="text-slate-400 text-sm mb-3">Today, 9:30 PM - Screen 2</p>
        <button class="w-full bg-emerald-500 hover:bg-emerald-600 py-2 rounded-lg transition">Book Now</button>
      </div>

      <div onclick="bookSeats(3)"
        class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-6 cursor-pointer hover:border-emerald-400/50 transition">
        <h3 class="text-xl font-bold mb-2">💕 Love Story</h3>
        <p class="text-slate-400 text-sm mb-3">Tomorrow, 6:00 PM - Screen 3</p>
        <button class="w-full bg-emerald-500 hover:bg-emerald-600 py-2 rounded-lg transition">Book Now</button>
      </div>
    </div>

    <!-- Quick Stats -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-6">
        <p class="text-slate-400 text-sm mb-2">Total Bookings</p>
        <p class="text-3xl font-bold" id="totalBookings">0</p>
      </div>
      <div class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-6">
        <p class="text-slate-400 text-sm mb-2">Upcoming Shows</p>
        <p class="text-3xl font-bold">3</p>
      </div>
      <div class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-6">
        <p class="text-slate-400 text-sm mb-2">Account Status</p>
        <p class="text-lg font-bold text-emerald-400" id="accountStatus">Active</p>
      </div>
    </div>
  </div>

  <script src="/auth-fragment.js"></script>
  <script>
    // Check authentication
    function checkAuth() {
      const token = localStorage.getItem('accessToken');
      if (!token) {
        window.location.href = '/login';
        return;
      }
    }

    // Load user info
    async function loadUserInfo() {
      try {
        const token = localStorage.getItem('accessToken');
        const response = await fetch('/api/auth/me', {
          headers: { 'Authorization': `Bearer ${token}` },
          credentials: 'include'
        });

        if (response.ok) {
          const data = await response.json();
          // User info loaded
        } else if (response.status === 401) {
          localStorage.removeItem('accessToken');
          window.location.href = '/login';
        }
      } catch (error) {
        console.error('Failed to load user info:', error);
      }
    }

    // Load booking count
    async function loadBookingCount() {
      try {
        const token = localStorage.getItem('accessToken');
        const response = await fetch('/api/bookings', {
          headers: { 'Authorization': `Bearer ${token}` },
          credentials: 'include'
        });

        if (response.ok) {
          const data = await response.json();
          document.getElementById('totalBookings').textContent = data.data?.length || 0;
        }
      } catch (error) {
        console.error('Failed to load bookings:', error);
      }
    }

    function navigateTo(page) {
      window.location.href = `/${page}`;
    }

    function bookSeats(showId) {
      window.location.href = `/booking?show=${showId}`;
    }

    async function logout() {
      const token = localStorage.getItem('accessToken');
      try {
        await fetch('/api/auth/logout', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
          credentials: 'include'
        });
      } catch (error) {
        console.error('Logout error:', error);
      }

      localStorage.removeItem('accessToken');
      localStorage.removeItem('user');
      window.location.href = '/login';
    }

    // Initialize (OIDC hash must be consumed before checkAuth)
    (async function init() {
      await initOidcReturnFromHash();
      checkAuth();
      loadUserInfo();
      loadBookingCount();
    })();
  </script>
</body>

</html>
