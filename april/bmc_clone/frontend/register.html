<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Stellar Seat Booking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap");

    body {
      font-family: "Outfit", sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
  </style>
</head>

<body
  class="min-h-screen flex items-center justify-center p-6 bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
  <div class="w-full max-w-md bg-slate-800/80 backdrop-blur-xl rounded-3xl shadow-2xl p-10 border border-slate-700/50">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400 mb-2">
        Create Account
      </h1>
      <p class="text-slate-400">Join us for amazing cinema experience</p>
    </div>

    <form id="registerForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2">Full Name</label>
        <input type="text" id="name" name="name" required
          class="w-full px-4 py-2 bg-slate-900/50 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-emerald-400 transition-colors"
          placeholder="John Doe" />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2">Email</label>
        <input type="email" id="email" name="email" required
          class="w-full px-4 py-2 bg-slate-900/50 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-emerald-400 transition-colors"
          placeholder="your@email.com" />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2">Password</label>
        <input type="password" id="password" name="password" required
          class="w-full px-4 py-2 bg-slate-900/50 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-emerald-400 transition-colors"
          placeholder="••••••••" />
        <p class="text-xs text-slate-400 mt-1">Min 6 characters</p>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required
          class="w-full px-4 py-2 bg-slate-900/50 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-emerald-400 transition-colors"
          placeholder="••••••••" />
      </div>

      <button type="submit"
        class="w-full bg-gradient-to-r from-emerald-500 to-cyan-500 text-white font-bold py-2 rounded-lg hover:shadow-lg transition-shadow">
        Register
      </button>
    </form>

    <div id="errorMessage"
      class="mt-4 p-3 bg-red-500/20 border border-red-500/50 rounded-lg text-red-400 text-sm hidden"></div>
    <div id="successMessage"
      class="mt-4 p-3 bg-emerald-500/20 border border-emerald-500/50 rounded-lg text-emerald-400 text-sm hidden"></div>

    <p class="text-center text-slate-400 text-sm mt-6">
      Already have an account?
      <a href="/login" class="text-emerald-400 hover:text-emerald-300 font-semibold">Login here</a>
    </p>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorMsg = document.getElementById('errorMessage');
      const successMsg = document.getElementById('successMessage');
      errorMsg.classList.add('hidden');
      successMsg.classList.add('hidden');

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        errorMsg.textContent = 'Passwords do not match';
        errorMsg.classList.remove('hidden');
        return;
      }

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, role: 'user' }),
          credentials: 'include'
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Registration failed');
        }

        successMsg.textContent = 'Registration successful! Check your email to verify. Redirecting to login...';
        successMsg.classList.remove('hidden');

        setTimeout(() => {
          window.location.href = '/login';
        }, 2000);
      } catch (error) {
        errorMsg.textContent = error.message;
        errorMsg.classList.remove('hidden');
      }
    });
  </script>
</body>

</html>
