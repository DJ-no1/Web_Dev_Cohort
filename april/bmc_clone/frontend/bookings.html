<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Bookings - Stellar Seat Booking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap");

    body {
      font-family: "Outfit", sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
  </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
  <!-- Navigation Bar -->
  <nav class="bg-slate-800/60 backdrop-blur-xl border-b border-slate-700/50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">
        Stellar
      </h1>
      <button onclick="window.location.href='/dashboard'" class="text-slate-400 hover:text-white transition">← Back to
        Dashboard</button>
    </div>
  </nav>

  <div class="max-w-6xl mx-auto px-6 py-10">
    <h1 class="text-3xl font-bold mb-8">My Bookings</h1>

    <div id="bookingsList" class="space-y-4">
      <!-- Bookings will be loaded here -->
    </div>

    <div id="emptyState" class="text-center py-12 hidden">
      <p class="text-slate-400 text-lg mb-4">No bookings yet</p>
      <button onclick="window.location.href='/dashboard'"
        class="px-6 py-2 bg-emerald-500 hover:bg-emerald-600 rounded-lg transition">
        Browse Shows
      </button>
    </div>
  </div>

  <script>
    async function loadBookings() {
      const token = localStorage.getItem('accessToken');
      if (!token) {
        window.location.href = '/login';
        return;
      }

      try {
        const response = await fetch('/api/bookings', {
          headers: { 'Authorization': `Bearer ${token}` },
          credentials: 'include'
        });

        if (response.status === 401) {
          localStorage.removeItem('accessToken');
          window.location.href = '/login';
          return;
        }

        const data = await response.json();
        const bookings = data.data || [];

        if (bookings.length === 0) {
          document.getElementById('emptyState').classList.remove('hidden');
          document.getElementById('bookingsList').classList.add('hidden');
          return;
        }

        renderBookings(bookings);
      } catch (error) {
        console.error('Error loading bookings:', error);
        alert('Failed to load bookings');
      }
    }

    function renderBookings(bookings) {
      const list = document.getElementById('bookingsList');
      list.innerHTML = bookings.map(booking => `
        <div class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-6">
          <div class="flex justify-between items-start mb-4">
            <div>
              <h3 class="text-xl font-bold mb-2">${booking.showName || 'Show ' + booking.showId}</h3>
              <p class="text-slate-400 text-sm mb-2">Booking ID: <span class="font-mono">${booking._id.substring(0, 12)}</span></p>
              <p class="text-slate-400 text-sm">Seats: <span class="font-bold text-emerald-400">${booking.seatIds.join(', ')}</span></p>
            </div>
            <div class="text-right">
              <p class="text-2xl font-bold text-emerald-400">₹${booking.totalPrice}</p>
              <p class="text-xs text-slate-400 mt-2">${new Date(booking.createdAt).toLocaleDateString()}</p>
            </div>
          </div>
          <div class="flex gap-3 pt-4 border-t border-slate-700">
            <button onclick="downloadTicket('${booking._id}')" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg transition text-sm">
              Download Ticket
            </button>
            <button onclick="cancelBooking('${booking._id}')" class="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-lg transition text-sm">
              Cancel Booking
            </button>
          </div>
        </div>
      `).join('');
    }

    async function cancelBooking(bookingId) {
      if (!confirm('Are you sure you want to cancel this booking?')) return;

      const token = localStorage.getItem('accessToken');
      try {
        const response = await fetch(`/api/bookings/${bookingId}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` },
          credentials: 'include'
        });

        if (response.ok) {
          alert('Booking cancelled successfully');
          loadBookings();
        } else {
          alert('Failed to cancel booking');
        }
      } catch (error) {
        console.error('Error cancelling booking:', error);
        alert('Error cancelling booking');
      }
    }

    function downloadTicket(bookingId) {
      alert('Ticket download feature coming soon! Booking ID: ' + bookingId);
    }

    // Initialize
    loadBookings();
  </script>
</body>

</html>
