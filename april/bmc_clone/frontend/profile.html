<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile - Stellar Seat Booking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap");

    body {
      font-family: "Outfit", sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
  </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
  <!-- Navigation Bar -->
  <nav class="bg-slate-800/60 backdrop-blur-xl border-b border-slate-700/50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">
        Stellar
      </h1>
      <button onclick="window.location.href='/dashboard'" class="text-slate-400 hover:text-white transition">← Back to
        Dashboard</button>
    </div>
  </nav>

  <div class="max-w-2xl mx-auto px-6 py-10">
    <h1 class="text-3xl font-bold mb-10">Your Profile</h1>

    <!-- User Info -->
    <div class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-8 mb-8">
      <h2 class="text-xl font-bold mb-6">Account Information</h2>

      <div class="space-y-4 mb-8">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Name</label>
          <p id="userName" class="text-lg">Loading...</p>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Email</label>
          <p id="userEmail" class="text-lg">Loading...</p>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Account Status</label>
          <p class="text-lg text-emerald-400">✓ Verified</p>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Member Since</label>
          <p id="memberSince" class="text-lg">Loading...</p>
        </div>
      </div>

      <button onclick="navigateTo('change-password')"
        class="px-6 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg transition">
        Change Password
      </button>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-2 gap-4">
      <div class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-6">
        <p class="text-slate-400 text-sm mb-2">Total Bookings</p>
        <p class="text-3xl font-bold" id="totalBookings">0</p>
      </div>
      <div class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-6">
        <p class="text-slate-400 text-sm mb-2">Total Spent</p>
        <p class="text-3xl font-bold text-emerald-400" id="totalSpent">₹0</p>
      </div>
    </div>
  </div>

  <script src="/auth-fragment.js"></script>
  <script>
    async function loadProfile() {
      const token = localStorage.getItem('accessToken');
      if (!token) {
        window.location.href = '/login';
        return;
      }

      try {
        const response = await fetch('/api/auth/me', {
          headers: { 'Authorization': `Bearer ${token}` },
          credentials: 'include'
        });

        if (response.status === 401) {
          localStorage.removeItem('accessToken');
          window.location.href = '/login';
          return;
        }

        if (!response.ok) throw new Error('Failed to load profile');

        const data = response.json();
        data.then(userData => {
          const user = userData.data;
          document.getElementById('userName').textContent = user.name || 'N/A';
          document.getElementById('userEmail').textContent = user.email || 'N/A';
          document.getElementById('memberSince').textContent = new Date(user.createdAt).toLocaleDateString();
        });
      } catch (error) {
        console.error('Error loading profile:', error);
      }
    }

    async function loadStats() {
      const token = localStorage.getItem('accessToken');
      try {
        const response = await fetch('/api/bookings', {
          headers: { 'Authorization': `Bearer ${token}` },
          credentials: 'include'
        });

        if (response.ok) {
          const data = await response.json();
          const bookings = data.data || [];
          document.getElementById('totalBookings').textContent = bookings.length;

          const totalSpent = bookings.reduce((sum, b) => sum + (b.totalPrice || 0), 0);
          document.getElementById('totalSpent').textContent = '₹' + totalSpent;
        }
      } catch (error) {
        console.error('Error loading stats:', error);
      }
    }

    function navigateTo(page) {
      window.location.href = `/${page}`;
    }

    // Initialize — consume OIDC hash before any auth check
    (async function init() {
      await initOidcReturnFromHash();
      loadProfile();
      loadStats();
    })();
  </script>
</body>

</html>
