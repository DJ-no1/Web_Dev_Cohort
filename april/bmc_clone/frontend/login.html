<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Stellar Seat Booking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap");

    body {
      font-family: "Outfit", sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
  </style>
</head>

<body
  class="min-h-screen flex items-center justify-center p-6 bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
  <div class="w-full max-w-md bg-slate-800/80 backdrop-blur-xl rounded-3xl shadow-2xl p-10 border border-slate-700/50">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400 mb-2">
        Stellar
      </h1>
      <p class="text-slate-400">Welcome back to cinema booking</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2">Email</label>
        <input type="email" id="email" name="email" required
          class="w-full px-4 py-2 bg-slate-900/50 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-emerald-400 transition-colors"
          placeholder="your@email.com" />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2">Password</label>
        <input type="password" id="password" name="password" required
          class="w-full px-4 py-2 bg-slate-900/50 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-emerald-400 transition-colors"
          placeholder="••••••••" />
      </div>

      <button type="submit"
        class="w-full bg-gradient-to-r from-emerald-500 to-cyan-500 text-white font-bold py-2 rounded-lg hover:shadow-lg transition-shadow">
        Login
      </button>
    </form>

    <div id="oidcSection" class="mt-6">
      <div class="relative flex items-center gap-3 py-2">
        <div class="h-px flex-1 bg-slate-600"></div>
        <span class="text-xs uppercase tracking-wider text-slate-500">or</span>
        <div class="h-px flex-1 bg-slate-600"></div>
      </div>
      <a id="oidcLoginBtn" href="/api/auth/oidc/login"
        class="mt-4 flex w-full items-center justify-center gap-2 rounded-lg border border-slate-600 bg-slate-900/50 py-2.5 text-sm font-semibold text-slate-200 transition hover:border-violet-500/60 hover:bg-slate-800/80 hover:text-white">
        <svg class="h-5 w-5 shrink-0 text-violet-400" fill="none" stroke="currentColor" stroke-width="2"
          viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
        Continue with OpenID Connect
      </a>
      <p id="oidcHint" class="mt-2 text-center text-xs text-slate-500">Opens <code
          class="rounded bg-slate-900/80 px-1 text-violet-300">/api/auth/oidc/login</code> — your browser will follow redirects to the IdP and back.</p>
    </div>

    <div id="errorMessage"
      class="mt-4 p-3 bg-red-500/20 border border-red-500/50 rounded-lg text-red-400 text-sm hidden"></div>

    <p class="text-center text-slate-400 text-sm mt-6">
      Don't have an account?
      <a href="/register" class="text-emerald-400 hover:text-emerald-300 font-semibold">Register here</a>
    </p>

    <p class="text-center text-slate-400 text-sm mt-2">
      <a href="/forgot-password" class="text-cyan-400 hover:text-cyan-300 text-xs">Forgot password?</a>
    </p>
  </div>

  <script src="/auth-fragment.js"></script>
  <script>
    (function showOidcUrlError() {
      try {
        const params = new URLSearchParams(window.location.search);
        const oidcErr = params.get('oidc_error');
        if (!oidcErr) return;
        const errBox = document.getElementById('errorMessage');
        if (errBox) {
          errBox.textContent = oidcErr;
          errBox.classList.remove('hidden');
        }
        const url = new URL(window.location.href);
        url.searchParams.delete('oidc_error');
        history.replaceState(null, '', url.pathname + url.search + url.hash);
      } catch (_) { /* ignore */ }
    })();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorMsg = document.getElementById('errorMessage');
      errorMsg.classList.add('hidden');

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
          credentials: 'include'
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Login failed');
        }

        localStorage.setItem('accessToken', data.data.accessToken);
        localStorage.setItem('user', JSON.stringify(data.data.user));

        window.location.href = '/dashboard';
      } catch (error) {
        errorMsg.textContent = error.message;
        errorMsg.classList.remove('hidden');
      }
    });

    (async function consumeOidcOnLoginPage() {
      await initOidcReturnFromHash();
      if (localStorage.getItem('accessToken')) {
        window.location.replace('/dashboard');
      }
    })();
  </script>
</body>

</html>
