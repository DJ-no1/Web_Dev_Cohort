<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stellar - Cinema Seat Booking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap");

    body {
      font-family: "Outfit", sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
  </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
  <div class="min-h-screen flex items-center justify-center p-6">
    <div class="max-w-2xl w-full text-center">
      <div class="mb-12">
        <h1 class="text-6xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400 mb-4">
          Stellar
        </h1>
        <p class="text-2xl text-slate-300 mb-6">Your Premium Cinema Experience</p>
        <p class="text-slate-400 mb-10">Book your favorite seats. Watch your favorite movies. Experience cinema like
          never before.</p>
      </div>

      <div class="space-y-4">
        <button onclick="window.location.href='/login'"
          class="w-full px-8 py-4 bg-gradient-to-r from-emerald-500 to-cyan-500 text-white text-lg font-bold rounded-lg hover:shadow-lg transition-shadow">
          Login to Your Account
        </button>

        <button onclick="window.location.href='/register'"
          class="w-full px-8 py-4 bg-slate-800 border-2 border-emerald-400 text-white text-lg font-bold rounded-lg hover:bg-emerald-500/10 transition-colors">
          Create New Account
        </button>
      </div>

      <div class="mt-16 grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-6">
          <p class="text-3xl mb-2">🎬</p>
          <h3 class="font-bold mb-2">Latest Movies</h3>
          <p class="text-slate-400 text-sm">Watch the newest blockbuster films</p>
        </div>

        <div class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-6">
          <p class="text-3xl mb-2">💺</p>
          <h3 class="font-bold mb-2">Premium Seats</h3>
          <p class="text-slate-400 text-sm">Choose your perfect seat</p>
        </div>

        <div class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-6">
          <p class="text-3xl mb-2">🎟️</p>
          <h3 class="font-bold mb-2">Easy Booking</h3>
          <p class="text-slate-400 text-sm">Book in just a few clicks</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Redirect if already logged in
    const token = localStorage.getItem('accessToken');
    if (token) {
      window.location.href = '/dashboard';
    }
  </script>
</body>

</html>
