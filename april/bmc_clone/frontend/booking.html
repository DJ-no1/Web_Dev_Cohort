<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Seats - Stellar Seat Booking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap");

    body {
      font-family: "Outfit", sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
  </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
  <!-- Navigation Bar -->
  <nav class="bg-slate-800/60 backdrop-blur-xl border-b border-slate-700/50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">
        Stellar
      </h1>
      <button onclick="window.location.href='/dashboard'" class="text-slate-400 hover:text-white transition">←
        Back</button>
    </div>
  </nav>

  <div class="max-w-4xl mx-auto px-6 py-10">
    <div class="text-center mb-10">
      <h1 class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400 mb-4">
        Select Your Seats
      </h1>
      <p class="text-slate-400">Dhurandhar The Revenge - Today, 7:00 PM</p>
    </div>

    <!-- Legend -->
    <div class="flex justify-center mb-10">
      <div
        class="bg-slate-900/50 rounded-full px-6 py-3 border border-slate-700 flex gap-8 items-center flex-wrap justify-center">
        <div class="flex items-center gap-3">
          <div class="w-4 h-4 rounded-full bg-emerald-500 shadow-[0_0_12px_rgba(16,185,129,0.6)]"></div>
          <span class="text-slate-300 font-medium">Available</span>
        </div>
        <div class="w-px h-6 bg-slate-700"></div>
        <div class="flex items-center gap-3">
          <div class="w-4 h-4 rounded-full bg-rose-500/20 border border-rose-500/50"></div>
          <span class="text-slate-400 font-medium">Booked</span>
        </div>
        <div class="w-px h-6 bg-slate-700"></div>
        <div class="flex items-center gap-3">
          <div class="w-4 h-4 rounded-full bg-yellow-500"></div>
          <span class="text-slate-400 font-medium">Selected</span>
        </div>
      </div>
    </div>

    <!-- Seat Selection -->
    <div class="flex justify-center mb-10">
      <div class="bg-slate-900/40 p-8 rounded-2xl border border-slate-700/50 shadow-inner">
        <table id="seatTable" class="border-separate border-spacing-3 mx-auto"></table>
      </div>
    </div>

    <!-- Booking Summary -->
    <div class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-6 max-w-md mx-auto">
      <h3 class="text-lg font-bold mb-4">Booking Summary</h3>
      <div class="space-y-2 text-sm mb-4">
        <div class="flex justify-between">
          <span class="text-slate-400">Selected Seats:</span>
          <span id="selectedSeats" class="font-bold">None</span>
        </div>
        <div class="flex justify-between">
          <span class="text-slate-400">Price per Seat:</span>
          <span>₹250</span>
        </div>
        <div class="border-t border-slate-700 pt-2 mt-2 flex justify-between font-bold">
          <span>Total:</span>
          <span id="totalPrice">₹0</span>
        </div>
      </div>
      <button onclick="proceedToPayment()"
        class="w-full bg-gradient-to-r from-emerald-500 to-cyan-500 text-white font-bold py-2 rounded-lg hover:shadow-lg transition-shadow">
        Proceed to Payment
      </button>
    </div>
  </div>

  <script src="/auth-fragment.js"></script>
  <script>
    const PRICE_PER_SEAT = 250;
    let selectedSeats = new Set();
    let allSeats = [];

    async function loadSeats() {
      try {
        const response = await fetch('/api/seats');
        if (!response.ok) throw new Error('Failed to load seats');

        const data = await response.json();
        allSeats = data.data || [];
        renderSeats();
      } catch (error) {
        console.error('Error loading seats:', error);
        alert('Failed to load seats');
      }
    }

    function renderSeats() {
      const table = document.getElementById('seatTable');
      table.innerHTML = '';

      const seatsPerRow = 8;
      let row = null;

      allSeats.forEach((seat, index) => {
        if (index % seatsPerRow === 0) {
          row = document.createElement('tr');
          table.appendChild(row);
        }

        const td = document.createElement('td');
        const baseClasses = 'w-12 h-12 rounded-lg text-center align-middle text-sm font-bold transition-all duration-300 select-none cursor-pointer';

        if (seat.isbooked) {
          td.className = `${baseClasses} bg-rose-500/10 text-rose-500/60 border border-rose-500/20 cursor-not-allowed`;
          td.innerHTML = seat.id;
        } else if (selectedSeats.has(seat.id)) {
          td.className = `${baseClasses} bg-yellow-500 text-white border-2 border-yellow-400`;
          td.innerHTML = seat.id;
          td.addEventListener('click', () => toggleSeat(seat.id));
        } else {
          td.className = `${baseClasses} bg-emerald-500 text-white border-2 border-emerald-400 hover:bg-emerald-400 hover:-translate-y-1 shadow-[0_0_10px_rgba(16,185,129,0.3)]`;
          td.innerHTML = seat.id;
          td.addEventListener('click', () => toggleSeat(seat.id));
        }

        row.appendChild(td);
      });
    }

    function toggleSeat(seatId) {
      if (selectedSeats.has(seatId)) {
        selectedSeats.delete(seatId);
      } else {
        selectedSeats.add(seatId);
      }
      updateSummary();
      renderSeats();
    }

    function updateSummary() {
      const seats = Array.from(selectedSeats).sort((a, b) => a - b);
      document.getElementById('selectedSeats').textContent = seats.length > 0 ? seats.join(', ') : 'None';
      document.getElementById('totalPrice').textContent = `₹${seats.length * PRICE_PER_SEAT}`;
    }

    async function proceedToPayment() {
      if (selectedSeats.size === 0) {
        alert('Please select at least one seat');
        return;
      }

      const token = localStorage.getItem('accessToken');
      if (!token) {
        window.location.href = '/login';
        return;
      }

      const seatsArray = Array.from(selectedSeats);

      try {
        const response = await fetch('/api/bookings', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          credentials: 'include',
          body: JSON.stringify({
            showId: getShowId(),
            seatIds: seatsArray,
            totalPrice: seatsArray.length * PRICE_PER_SEAT
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Booking failed');
        }

        alert('Booking confirmed! Redirecting...');
        window.location.href = '/bookings';
      } catch (error) {
        alert('Booking error: ' + error.message);
      }
    }

    function getShowId() {
      const params = new URLSearchParams(window.location.search);
      return params.get('show') || '1';
    }

    // Initialize (OIDC hash before auth check)
    (async function init() {
      await initOidcReturnFromHash();
      const token = localStorage.getItem('accessToken');
      if (!token) {
        window.location.href = '/login';
      } else {
        loadSeats();
      }
    })();
  </script>
</body>

</html>
